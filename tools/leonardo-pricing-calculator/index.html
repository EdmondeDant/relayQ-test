<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leonardo API Pricing Calculator</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#191919;--line:#3c3c3c;--muted:#aaa;--purple:#876dff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px Inter,"Microsoft YaHei",sans-serif}.top{height:76px;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}.wrap{max-width:1160px;margin:auto;padding:54px 18px}h1{font-size:26px;margin:0 0 8px}.intro{color:#ddd;margin-bottom:26px}.grid{display:grid;grid-template-columns:370px 370px 1fr;gap:12px}.card{border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden;min-height:520px}.head{font-size:16px;font-weight:700;padding:17px 14px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:20px;padding:15px 14px 0}.tab{background:0;border:0;border-bottom:2px solid transparent;color:#aaa;padding:0 3px 10px;font-weight:700;cursor:pointer}.tab.on{color:#fff;border-color:var(--purple)}.models{padding:12px;height:430px;overflow:auto}.model{display:block;width:100%;text-align:left;color:#fff;background:#282828;border:1px solid transparent;border-radius:17px;padding:13px;margin-bottom:8px;cursor:pointer}.model.on{border-color:var(--purple);background:#28213f}.model small{display:block;color:#aaa;margin-top:4px}.settings{padding:14px}.label{margin:10px 0 8px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}.choice{border:1px solid transparent;border-radius:9px;background:#303030;color:#fff;min-height:58px;padding:7px;cursor:pointer}.choice.on{border-color:var(--purple);background:#292143}.choice small{display:block;color:#bbb;margin-top:4px}.right{padding:0 15px}.row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid #303030}.num{width:84px;background:#111;color:#fff;border:1px solid #444;border-radius:8px;padding:8px;text-align:right}.total{font-size:30px;color:var(--purple);font-weight:800;margin-top:12px}.detail{color:#aaa;line-height:1.7;margin-top:16px}.stamp{font-size:12px;color:#888;margin-top:20px}@media(max-width:950px){.grid{grid-template-columns:1fr}.card{min-height:0}.models{height:300px}}
</style><header class="top">Leonardo API · Pricing Calculator</header><main class="wrap"><h1>Pricing Calculator</h1><div class="intro">选择图片或视频模型与生成设置，自动换算美元和人民币成本。</div><section class="grid"><div class="card"><div class="head">1. Select Model</div><div class="tabs"><button class="tab on" data-type="image">Image</button><button class="tab" data-type="video">Video</button></div><div id="models" class="models"></div></div><div class="card"><div class="head">2. Settings</div><div id="settings" class="settings"></div></div><div class="card"><div class="head">3. Calculate API Cost</div><div class="right"><div class="row"><span>Number of Generations</span><input id="qty" class="num" type="number" min="1" value="1"></div><div class="row"><span>USD/CNY 汇率</span><input id="fx" class="num" type="number" step=".0001" value="7.19"></div><div class="row"><span>Cost per Generation</span><b id="usd">0.0000 USD</b></div><div class="detail">Estimated Total</div><div id="total" class="total">¥0.00</div><div id="formula" class="detail"></div><div class="stamp">费率采集自 Leonardo 已登录计算器，2026-08-01。页面当前共 32 个图片模型、31 个视频模型。</div></div></div></section></main><script src="pricing-data.js"></script><script>
let type='image',model=Object.keys(PRICING.image)[0],state={};const $=x=>document.getElementById(x);function data(){return PRICING[type][model]}function pick(k,v){state[k]=v;renderSettings()}function buttons(title,key,arr,fmt=x=>x){if(!arr||!arr.length||arr.length===1&&arr[0]==null)return'';return `<div class="label">${title}</div><div class="choices">${arr.map(x=>{let text=fmt(x),p=String(text).split(/\s(?=\d)|\|/);return `<button class="choice ${state[key]===x?'on':''}" data-key="${key}" data-val="${x}">${p[0]}${p[1]?`<small>${p.slice(1).join(' ')}</small>`:''}</button>`}).join('')}</div>`}function resetState(){let d=data();state={quality:d.qualities?.[0]??null,size:d.sizes?.[0]??null,ratio:d.ratios?.[0]??null,duration:d.durations?.[0]??null,resolution:d.resolutions?.[0]??null}}function renderModels(){$('models').innerHTML=Object.keys(PRICING[type]).map((n,i)=>`<button class="model ${n===model?'on':''}" data-model="${n}"><b>${n}</b><small>${i<9?'Featured':'Other model'}</small></button>`).join('');document.querySelectorAll('[data-model]').forEach(b=>b.onclick=()=>{model=b.dataset.model;resetState();renderModels();renderSettings()})}function renderSettings(){let d=data(),html='';if(type==='image'){html+=buttons('Quality','quality',d.qualities);html+=buttons('Aspect Ratio','ratio',d.ratios);html+=buttons('Image Dimensions','size',d.sizes)}else{html+=buttons('Duration','duration',d.durations,x=>x==null?'Default':x+'s');html+=buttons('Aspect Ratio','ratio',d.ratios);html+=buttons('Resolution','resolution',d.resolutions)}$('settings').innerHTML=html||'<div class="detail">该模型没有额外设置。</div>';document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let k=b.dataset.key,v=b.dataset.val;if(k==='duration')v=+v;pick(k,v)});calc()}function price(){let d=data();if(type==='image'){let c=d.configs.find(x=>x.quality===state.quality&&x.size===state.size);return c?.cost??0}if(d.slider){let c=d.configs.find(x=>x.resolution===state.resolution)||d.configs[0],span=c.max-c.min;if(!span)return c.minCost;return c.minCost+(state.duration-c.min)*(c.maxCost-c.minCost)/span}let c=d.configs.find(x=>x.duration===state.duration&&x.resolution===state.resolution);return c?.cost??0}function calc(){let p=price(),q=+$('qty').value||0,fx=+$('fx').value||0;$('usd').textContent=p.toFixed(4)+' USD';$('total').textContent='¥'+(p*q*fx).toFixed(2);$('formula').textContent=`$${p.toFixed(4)} × ${q} 次 × ${fx} = ¥${(p*q*fx).toFixed(2)}`}$('qty').oninput=calc;$('fx').oninput=calc;document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;model=Object.keys(PRICING[type])[0];document.querySelectorAll('[data-type]').forEach(x=>x.classList.toggle('on',x===b));resetState();renderModels();renderSettings()});resetState();renderModels();renderSettings();
</script></html>
